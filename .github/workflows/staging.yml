name: Deploy staging

on:
  workflow_dispatch:
  push:
    branches:
      - staging

permissions: {}

concurrency:
  group: staging-deployment
  cancel-in-progress: true

jobs:
  build-package:
    name: Build staging package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global npm@12.0.2
      - run: npm ci
      - name: Check source
        run: npm run check
      - name: Stamp staging package version
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          SOURCE_VERSION=$(node --print "require('./package.json').version")
          npm version "${SOURCE_VERSION}-staging.${RUN_ID}" \
            --no-git-tag-version \
            --ignore-scripts
      - name: Build publishable artifact
        run: |
          PACKAGE_FILE=$(npm pack --silent | tail -n 1)
          mv "$PACKAGE_FILE" shipyard-staging.tgz
          sha256sum shipyard-staging.tgz > shipyard-staging.tgz.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77f36085b0efc47a31fe5020 # v7.0.1
        with:
          name: npm-staging-package-${{ github.sha }}
          path: |
            shipyard-staging.tgz
            shipyard-staging.tgz.sha256
          if-no-files-found: error
          retention-days: 7

  smoke-package:
    name: Smoke staging package
    needs: build-package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-staging-package-${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.18.1
          package-manager-cache: false
      - name: Smoke exact staging package
        run: node scripts/smoke-packed-package.mjs shipyard-staging.tgz

  publish:
    name: Publish staging package
    needs:
      - build-package
      - smoke-package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: https://www.npmjs.com/package/@snappedly-tools/shipyard?activeTab=versions
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-staging-package-${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@12.0.2
      - name: Verify exact staging artifact
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          sha256sum --check shipyard-staging.tgz.sha256
          git fetch origin staging
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse origin/staging)" = "$CANDIDATE_SHA"
          PACKAGE_VERSION=$(tar -xOf shipyard-staging.tgz package/package.json | node --input-type=module --eval "let input=''; process.stdin.on('data', chunk => input += chunk); process.stdin.on('end', () => console.log(JSON.parse(input).version))")
          case "$PACKAGE_VERSION" in
            *-staging.*) ;;
            *)
              echo "Expected a staging prerelease version, got $PACKAGE_VERSION" >&2
              exit 1
              ;;
          esac
      - name: Publish
        run: npm publish shipyard-staging.tgz --access public --tag staging --provenance
