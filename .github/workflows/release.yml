name: Release npm package

on:
  workflow_dispatch:
  push:
    branches:
      - production

permissions: {}

jobs:
  select-mode:
    name: Select release mode
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      statuses: write
    outputs:
      mode: ${{ steps.changesets.outputs.mode }}
    steps:
      - name: Mark release CI as pending
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" \
            -f state=pending \
            -f context=ci \
            -f description="Release CI is running" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global npm@12.0.2
      - run: npm ci
      - run: npm run check
      - name: Select Changesets mode
        id: changesets
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    name: Version and merge release pull request
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: changesets-version
      cancel-in-progress: false
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global npm@12.0.2
      - run: npm ci
      - name: Verify exact production revision
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          git fetch origin production
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse origin/production)" = "$CANDIDATE_SHA"
      - name: Create or update version pull request
        id: changesets
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: npm run version-packages
      - name: Run CI for version pull request
        if: steps.changesets.outputs.pr-number != ''
        id: version-ci
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.changesets.outputs.pr-number }}
        run: |
          set -euo pipefail
          HEAD_REF=$(gh pr view "$PR_NUMBER" --json headRefName --jq .headRefName)
          HEAD_SHA=$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)
          gh workflow run ci.yml --ref "$HEAD_REF"

          RUN_ID=""
          for _ in $(seq 1 30); do
            RUN_ID=$(gh run list \
              --workflow ci.yml \
              --event workflow_dispatch \
              --commit "$HEAD_SHA" \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')
            if [[ -n "$RUN_ID" ]]; then
              break
            fi
            sleep 2
          done

          test -n "$RUN_ID"
          gh run watch "$RUN_ID" --compact --exit-status
          {
            echo "head-ref=$HEAD_REF"
            echo "head-sha=$HEAD_SHA"
            echo "run-id=$RUN_ID"
          } >> "$GITHUB_OUTPUT"

      # workflow_dispatch checks are not evaluated as pull request checks by
      # branch protection. Mirror the successful exact-head run as the
      # required status so the generated PR can merge without approval.
      - name: Publish version pull request CI status
        if: steps.version-ci.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.version-ci.outputs.head-sha }}
          RUN_ID: ${{ steps.version-ci.outputs.run-id }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=success \
            -f context=ci \
            -f description="Version pull request CI passed" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"

      - name: Merge version pull request
        if: steps.version-ci.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.version-ci.outputs.head-sha }}
          PR_NUMBER: ${{ steps.changesets.outputs.pr-number }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" \
            --squash \
            --delete-branch \
            --match-head-commit "$HEAD_SHA" \
            --auto

          for _ in $(seq 1 30); do
            STATE=$(gh pr view "$PR_NUMBER" --json state --jq .state)
            if [[ "$STATE" == "MERGED" ]]; then
              exit 0
            fi
            sleep 2
          done

          echo "Version pull request #$PR_NUMBER did not merge after auto-merge was enabled." >&2
          exit 1

      - name: Start release for versioned production
        if: steps.version-ci.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        # Merges made with GITHUB_TOKEN do not emit a new push workflow run.
        # Dispatch explicitly so the merged version is built and published.
        run: gh workflow run release.yml --ref production

  build-package:
    name: Build npm package
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact candidate
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          git fetch origin production
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse origin/production)" = "$CANDIDATE_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@12.0.2
      - run: npm ci
      - run: npm run check
      - name: Build publishable artifact
        run: |
          PACKAGE_FILE=$(npm pack --silent | tail -n 1)
          mv "$PACKAGE_FILE" shipyard.tgz
          sha256sum shipyard.tgz > shipyard.tgz.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package-${{ github.sha }}
          path: |
            shipyard.tgz
            shipyard.tgz.sha256
          if-no-files-found: error
          retention-days: 7

  smoke-package:
    name: Smoke exact package
    if: needs.select-mode.outputs.mode == 'publish'
    needs:
      - select-mode
      - build-package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package-${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.18.1
          package-manager-cache: false
      - name: Smoke exact package at minimum Node version
        run: node scripts/smoke-packed-package.mjs shipyard.tgz

  record-release-ci-status:
    name: Record release candidate CI status
    if: always()
    needs:
      - select-mode
      - version
      - build-package
      - smoke-package
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      # The version pull request is merged with GITHUB_TOKEN, so its push
      # event does not start ci.yml. Record the exact-candidate result as the
      # required commit status so the merged release commit has the same
      # visible CI signal as a normal production push. The pending status is posted
      # before the repository check starts; this finalizer also runs when an
      # earlier job fails so the status cannot disappear without a result.
      - name: Publish final exact candidate CI status
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.sha }}
          SELECT_RESULT: ${{ needs.select-mode.result }}
          MODE: ${{ needs.select-mode.outputs.mode }}
          VERSION_RESULT: ${{ needs.version.result }}
          BUILD_RESULT: ${{ needs.build-package.result }}
          SMOKE_RESULT: ${{ needs.smoke-package.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ "$SELECT_RESULT" != "success" ]]; then
            STATE=failure
            DESCRIPTION="Release mode selection or repository check failed"
          elif [[ "$MODE" == "version" ]]; then
            if [[ "$VERSION_RESULT" == "success" ]]; then
              STATE=success
              DESCRIPTION="Version pull request CI and merge passed"
            else
              STATE=failure
              DESCRIPTION="Version pull request workflow failed"
            fi
          elif [[ "$MODE" == "publish" && "$BUILD_RESULT" == "success" && "$SMOKE_RESULT" == "success" && "$PUBLISH_RESULT" == "success" ]]; then
            STATE=success
            DESCRIPTION="Build, smoke checks, and publication passed"
          elif [[ "$MODE" != "publish" ]]; then
            STATE=success
            DESCRIPTION="Repository checks passed; no release required"
          else
            STATE=failure
            if [[ "$BUILD_RESULT" != "success" ]]; then
              DESCRIPTION="Release candidate build failed"
            elif [[ "$SMOKE_RESULT" != "success" ]]; then
              DESCRIPTION="Release candidate smoke checks failed"
            else
              DESCRIPTION="Release candidate publication failed"
            fi
          fi

          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" \
            -f state="$STATE" \
            -f context=ci \
            -f description="$DESCRIPTION" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"

  publish:
    name: Publish npm package
    if: needs.select-mode.outputs.mode == 'publish'
    needs:
      - select-mode
      - build-package
      - smoke-package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: production
      cancel-in-progress: false
    environment:
      name: production
      url: https://www.npmjs.com/package/@snappedly-tools/shipyard
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package-${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@12.0.2
      - name: Verify artifact and exact candidate
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          sha256sum --check shipyard.tgz.sha256
          git fetch origin production
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse origin/production)" = "$CANDIDATE_SHA"
          SOURCE_VERSION=$(node --print "require('./package.json').version")
          PACKAGE_VERSION=$(tar -xOf shipyard.tgz package/package.json | node --input-type=module --eval "let input=''; process.stdin.on('data', chunk => input += chunk); process.stdin.on('end', () => console.log(JSON.parse(input).version))")
          test "$SOURCE_VERSION" = "$PACKAGE_VERSION"
      - name: Publish
        run: npm publish shipyard.tgz --access public --provenance
      - name: Create GitHub release
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node --print "require('./package.json').version")
          gh release create "v${VERSION}" \
            --target "$CANDIDATE_SHA" \
            --title "Shipyard v${VERSION}" \
            --generate-notes
