name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  package-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm install --global npm@12.0.2
      - run: npm ci
      - run: npm pack --silent | tail -n 1 > package-file.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.18.1
      - run: node scripts/smoke-packed-package.mjs "$(cat package-file.txt)"

  ci:
    name: ci
    if: always()
    needs:
      - package-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to pass
        env:
          PACKAGE_SMOKE_RESULT: ${{ needs.package-smoke.result }}
        run: |
          test "$PACKAGE_SMOKE_RESULT" = success
